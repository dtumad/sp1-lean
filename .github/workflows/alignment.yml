name: SP1 Alignment

# The SP1-alignment layers: the full umbrella build (`lake build SP1Clean` — extracted oracles,
# Faithful, the per-chip Sail bridges and machine contracts, Proofs/Sail, Proofs/Completeness,
# Soundness, Composition), the full test library (`SP1CleanTest`, including the alignment-only
# anchors), the environment linters over everything, the witgen/dump conformance gates, and both
# axiom censuses. It runs weekly, on demand, and on pushes to `main`; PR CI (`lean_action_ci.yml`)
# builds only the core. Same resumable-cache design as the PR workflow: the alignment cache has its
# own prefix and falls back to the core cache, so a warm core build seeds a cold alignment build.
# Both caches are written by runs on `main` (this workflow runs on pushes to `main`), which is the
# scope other branches can restore from.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SP1_CACHE_VERSION: v1

jobs:
  build-full:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      cache-prefix: ${{ steps.key.outputs.prefix }}
      align-prefix: ${{ steps.key.outputs.align }}
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: Compute cache keys
        id: key
        run: |
          prefix="sp1-${SP1_CACHE_VERSION}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "align=${prefix}-align" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}-align-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Restore the build cache (alignment first, then the core cache)
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/*
            !.lake/packages/mathlib
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            ${{ steps.key.outputs.align }}-
            ${{ steps.key.outputs.prefix }}-
      - uses: leanprover/lean-action@v1
        with:
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Full build (resumable — a cold cache may need one re-run)
        run: timeout 5h lake build --wfail --iofail SP1Clean ToClean ToMathlib ToPolyFun
      - name: Save the build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            .lake/packages/*
            !.lake/packages/mathlib
          key: ${{ steps.key.outputs.key }}

  lint-full:
    needs: build-full
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup
          df -h /
      - uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/*
            !.lake/packages/mathlib
          key: ${{ needs.build-full.outputs.cache-key }}
          restore-keys: |
            ${{ needs.build-full.outputs.align-prefix }}-
      - uses: leanprover/lean-action@v1
        with:
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Replay the full build
        run: lake build --wfail --iofail SP1Clean ToClean ToMathlib ToPolyFun
      - name: Environment linters (lake lint = batteries/runLinter over the four roots)
        run: lake lint -- --no-build

  test-full:
    needs: build-full
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup
          df -h /
      - uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/*
            !.lake/packages/mathlib
          key: ${{ needs.build-full.outputs.cache-key }}
          restore-keys: |
            ${{ needs.build-full.outputs.align-prefix }}-
      - name: Restore the test-library build cache (incremental)
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build/lib/lean/SP1CleanTest
            .lake/build/ir/SP1CleanTest
          key: ${{ needs.build-full.outputs.align-prefix }}-test-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ needs.build-full.outputs.align-prefix }}-test-
            ${{ needs.build-full.outputs.cache-prefix }}-test-
      - uses: leanprover/lean-action@v1
        with:
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Replay the full build
        run: lake build --wfail --iofail SP1Clean ToClean ToMathlib ToPolyFun
      - name: Full test library (lake build SP1CleanTest)
        run: timeout 5h lake build --wfail --iofail SP1CleanTest
      - name: Save the test-library build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build/lib/lean/SP1CleanTest
            .lake/build/ir/SP1CleanTest
          key: ${{ needs.build-full.outputs.align-prefix }}-test-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Whole-ensemble export identity
        run: bash scripts/check_ensemble_export.sh
      # The committed export/witgen goldens must match a fresh regeneration byte-for-byte; the
      # exporter maps native rows through the `Faithful` reconfigure maps, so it needs the full
      # library built above even though the exportability battery itself is core.
      - name: Witgen export matches a fresh regeneration
        run: scripts/check_witgen_export.sh --regen
      - name: Test-library axiom census (scripts/run_audit.sh --test-only)
        run: scripts/run_audit.sh --test-only

  audit-full:
    # The release audit harness over the whole library: pin cross-checks, the zero-tolerance
    # proof-deferral and project-axiom scans, the source-policy guards, and the `#print axioms`
    # census gated against docs/snapshots/axiom-census.txt.
    needs: build-full
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup
          df -h /
      - uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/*
            !.lake/packages/mathlib
          key: ${{ needs.build-full.outputs.cache-key }}
          restore-keys: |
            ${{ needs.build-full.outputs.align-prefix }}-
      - uses: leanprover/lean-action@v1
        with:
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Replay the full build
        run: lake build --wfail --iofail SP1Clean ToClean ToMathlib ToPolyFun
      - name: Release audit, main scope (scripts/run_audit.sh --main-only)
        run: scripts/run_audit.sh --main-only
