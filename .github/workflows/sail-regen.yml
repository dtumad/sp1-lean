name: Sail Model Regeneration

# Reproduce the ignored model from immutable inputs, independently of the source cache.
# Preparation caches are accepted only after fingerprint verification. This workflow always
# regenerates, including the stock-config comparison, and can publish the verified source cache.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 1 * *"
  pull_request:
    paths:
      - "scripts/sail-config/**"
      - "scripts/provenance.json"
      - "scripts/prepare_sail.py"
      - "scripts/check_pins.py"
      - "lakefile.toml"
      - ".github/actions/prepare-sail/**"
      - "lake-manifest.json"
      - ".github/workflows/sail-regen.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SAIL_GEN_DIR: ${{ github.workspace }}/.lake/sail-gen
    steps:
      - uses: actions/checkout@v4

      - name: Read the toolchain provenance
        id: pins
        run: |
          python3 - <<'PY'
          import json, os
          sail = json.load(open('scripts/provenance.json'))['sail']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('SAIL_SHA=' + sail['compilerRevision'], file=out)
              print('OCAML_VERSION=' + sail['ocamlVersion'], file=out)
              print('MODEL_SHA=' + sail['generatedTreeSha256'], file=out)
          PY

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y opam cmake z3 libgmp-dev pkg-config zlib1g-dev m4

      - name: Restore the Sail toolchain (opam root with the built compiler)
        id: sail-cache
        uses: actions/cache@v4
        with:
          path: |
            .lake/sail-gen/opam
            .lake/sail-gen/compiler-revision
          key: sail-toolchain-${{ runner.os }}-ocaml${{ steps.pins.outputs.OCAML_VERSION }}-${{ steps.pins.outputs.SAIL_SHA }}

      - name: Build or verify the pinned Sail compiler
        run: scripts/sail-config/generate_lean_rv64d.sh --deps

      - name: The committed config is base ⊕ overlay for the pinned sail-riscv
        run: |
          scripts/sail-config/generate_lean_rv64d.sh --make-config
          git diff --exit-code -- scripts/sail-config/sp1_rv64d_cfg.json

      - name: Independently regenerate and check the SP1-configured fingerprint
        run: |
          scripts/sail-config/generate_lean_rv64d.sh --sp1
          python3 scripts/prepare_sail.py --from .lake/sail-gen/sail-riscv/build/model/Lean_RV64D

      - name: Save the verified portable sources
        uses: actions/cache/save@v4
        with:
          path: .lake/generated/sail
          key: sail-source-${{ steps.pins.outputs.MODEL_SHA }}

      - name: Regenerate with the stock config and compare with the opencompl base
        run: scripts/sail-config/generate_lean_rv64d.sh --stock
