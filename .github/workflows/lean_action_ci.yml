name: Lean Action CI

# GitHub-hosted runners only. The four heavy jobs used to pin succinctlabs' self-hosted RunsOn
# labels (`runner=64cpu-linux-x64`); on any other repository those jobs never start. This workflow
# runs on `ubuntu-latest` (4 vCPU / 16 GB / ~14 GB free disk on public repositories) and makes that
# feasible with three measures:
#
# 1. Mathlib is never stored in the GitHub Actions cache. lean-action's `use-mathlib-cache` runs
#    `lake exe cache get` every job (about 6 GB of oleans, a few minutes), which keeps every cache
#    entry below the 10 GB per-repository limit that lean-action's whole-`.lake` cache would exceed.
# 2. The project build (`.lake/build`, about 4 GB raw) and every non-mathlib package checkout are
#    cached under a key that ends in the commit SHA, with a prefix `restore-keys` fallback. A run
#    therefore starts from the most recent prior build and Lake rebuilds only what changed.
# 3. The build is resumable. `build` runs `lake build` under a 5-hour `timeout` and saves its cache
#    even on failure; Lake's per-module traces make a partial build reusable, so a cold cache that
#    cannot finish inside one job fails once and the re-run continues where it stopped. Once warm,
#    builds are incremental and take minutes. The save is skipped on a CANCELLED job
#    (`success() || failure()`, not `always()`): a cancelled `lake build` can leave a truncated
#    `.olean` behind its already-written trace, and a cache entry holding one poisons every later
#    run that restores it (`failed to read file … invalid header`, seen 2026-09-20 after two
#    superseded `main` runs were cancelled by the concurrency group). If that ever recurs, delete
#    the offending entries with `gh cache delete` or bump `SP1_CACHE_VERSION`.
#
# Structure: `guards` (source-policy gates, seconds) runs in parallel with `build`; `lint` and
# `test` need `build` and restore its exact cache entry so they replay rather than recompile.
#
# Cache scoping: GitHub makes a cache entry visible only to the branch that created it and to
# branches based on it (through the default branch). An entry saved by a pull-request run lives on
# that PR's merge ref and is invisible to every other PR, so the warm cache PRs actually restore is
# the one written by the `push` run on `main`. Merging to `main` therefore refreshes the shared
# cache; a PR's own first build is incremental only from `main`'s entry.
#
# Scope: this workflow builds the CORE (`lake build` = `SP1Core` + `ToClean` + `ToMathlib` +
# `ToPolyFun`: the generic/semantic layers and the chip circuits with their proofs, reached through
# the gated root index `SP1Clean/Core.lean`) and its test set (`lake test` = `SP1CoreTest`). Every
# build runs with `--wfail --iofail`: a warning (the Mathlib standard linter set is on package-wide)
# or a stray `info:` note fails the job. The SP1-alignment layers (extracted oracles, Faithful, Sail bridges, Soundness,
# Composition), their tests, the witgen/dump conformance gates, and the axiom census run in
# `alignment.yml` (scheduled weekly, on demand, and on pushes to `main`), which shares this cache
# as a fallback. See docs/agents/compile-profile-2026-09.md for the measurement behind the split.

on:
  push:
    branches: ["main", "ci-testing"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump to invalidate every cache entry (toolchain and manifest changes already rekey).
  SP1_CACHE_VERSION: v1

jobs:
  guards:
    # Lightweight source-policy gates — run on a standard runner in parallel with the
    # heavy build so a forbidden pattern blocks the PR in seconds without a Lean build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: No skipKernelTC in source
        run: scripts/check_no_skipkerneltc.sh
      - name: No native_decide in the main SP1Clean library
        run: scripts/check_no_native_decide.sh
      - name: Elaboration-budget escape hatches confined to the measured allowlist
        run: scripts/check_option_escapes.sh
      - name: Witness-generation escape hatches (enforced — the witgen cutover is complete)
        run: scripts/check_no_witness_native.sh --enforce
      - name: Committed witgen export is structurally clean
        run: scripts/check_witgen_export.sh
      - name: Recorded pins match the build graph
        run: scripts/check_pins.sh
      - name: Axiom probe inventory matches source
        run: python3 scripts/gen_axiom_probe.py --check
      - name: Audit tooling regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Root index imports every module
        run: scripts/check_root_index.sh
      - name: SP1 field has one Lean owner
        run: scripts/check_sp1_field_singleton.sh
      - name: Shared shard vocabulary has one owner
        run: scripts/check_shared_vocabulary.sh
      - name: Doc citations resolve
        run: scripts/check_report_citations.sh
      - name: Audit-surface index matches the tree
        run: scripts/check_audit_surface.sh
      - name: Layering contract holds
        run: scripts/check_layering.sh

  build:
    runs-on: ubuntu-latest
    # Below GitHub's 6-hour job limit, above the 5-hour `timeout` on `lake build` so the cache
    # save step always gets to run.
    timeout-minutes: 350
    outputs:
      cache-prefix: ${{ steps.key.outputs.prefix }}
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # The hosted image ships ~25 GB of toolchains this project never uses; the toolchain,
        # mathlib oleans, the project build and the cache archives need roughly 16 GB together.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: Compute cache keys
        id: key
        run: |
          prefix="sp1-${SP1_CACHE_VERSION}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Restore the project build cache (incremental)
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/*
            !.lake/packages/mathlib
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            ${{ steps.key.outputs.prefix }}-${{ github.sha }}-
            ${{ steps.key.outputs.prefix }}-
      - uses: leanprover/lean-action@v1
        # Installs the pinned toolchain and fetches the mathlib olean cache; the build itself runs
        # in the next step so it can be bounded by `timeout`.
        with:
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Build (resumable — a cold cache may need one re-run)
        run: timeout 5h lake build --wfail --iofail
      - name: Save the project build cache
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build
            .lake/packages/*
            !.lake/packages/mathlib
          key: ${{ steps.key.outputs.key }}

  lint:
    # Environment linters (Batteries' `runLinter`, the package's `lintDriver`; see AGENTS.md
    # § Linters). `lake lint` lints the four roots and needs the umbrella oleans, which only the
    # alignment workflow builds; here the driver is invoked on the core index instead.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup
          df -h /
      - name: Restore the project build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/*
            !.lake/packages/mathlib
          key: ${{ needs.build.outputs.cache-key }}
          restore-keys: |
            ${{ needs.build.outputs.cache-prefix }}-${{ github.sha }}-
            ${{ needs.build.outputs.cache-prefix }}-
      - uses: leanprover/lean-action@v1
        with:
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Replay the build
        run: lake build --wfail --iofail
      - name: Environment linters, core scope (runLinter on the core index)
        run: lake exe runLinter --no-build SP1Clean.Core ToClean ToMathlib ToPolyFun

  test:
    # Core tests (`lake test` → the `SP1CoreTest` testDriver: the test modules whose import closure
    # stays inside the core — including the exportability battery and both non-vacuity batteries,
    # which import the chip `Formal`/`Witgen` modules rather than the umbrella). The alignment-only
    # anchors, the witgen regeneration gate (its exporter needs the `Faithful` reconfigure maps),
    # and the test-scope axiom census run in `alignment.yml`. Test modules are the ONLY place `native_decide`
    # is allowed, so they are gated here separately from the `native_decide`-free main build. The
    # test-library oleans get their own incremental cache so unchanged test modules are not
    # re-elaborated every run.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        # run_audit.sh verifies the census provenance stamp with
        # `git merge-base --is-ancestor`, which needs the stamped commit in this clone.
        with:
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup
          df -h /
      - name: Restore the project build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build
            .lake/packages/*
            !.lake/packages/mathlib
          key: ${{ needs.build.outputs.cache-key }}
          restore-keys: |
            ${{ needs.build.outputs.cache-prefix }}-${{ github.sha }}-
            ${{ needs.build.outputs.cache-prefix }}-
      - name: Restore the test-library build cache (incremental)
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/build/lib/lean/SP1CleanTest
            .lake/build/ir/SP1CleanTest
          key: ${{ needs.build.outputs.cache-prefix }}-test-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ needs.build.outputs.cache-prefix }}-test-
      - uses: leanprover/lean-action@v1
        with:
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Replay the build
        run: lake build --wfail --iofail
      - name: Core tests (lake test = SP1CoreTest, with the warning/info gates)
        run: timeout 5h lake build --wfail --iofail SP1CoreTest
      - name: Save the test-library build cache
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/build/lib/lean/SP1CleanTest
            .lake/build/ir/SP1CleanTest
          key: ${{ needs.build.outputs.cache-prefix }}-test-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Whole-ensemble export identity
        run: bash scripts/check_ensemble_export.sh
