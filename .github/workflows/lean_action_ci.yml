name: Lean Action CI

# GitHub-hosted runners only (`ubuntu-latest`: 4 vCPU / 16 GB; a personal account cannot use larger
# runners). Three measures make that feasible:
#
# 1. Mathlib is never stored in the GitHub Actions cache. lean-action's `use-mathlib-cache` runs
#    `lake exe cache get` (about 6 GB of oleans, one to two minutes), which keeps every cache entry
#    well below the 10 GB per-repository limit; the same tool also restores Batteries, Aesop, Qq,
#    ProofWidgets, importGraph, LeanSearchClient and plausible (measured 2026-09-21; `Cli` is not
#    among them), so those seven are excluded from our entries too (`CACHE_PATHS`). NB the path list is part of the entry's version hash: editing it
#    invalidates every existing entry, so bump `SP1_CACHE_VERSION` in the same change.
# 2. The project build (`.lake/build`) and the remaining package checkouts are cached under a key
#    `<prefix>-<kind>-<sha>-<run id>-<attempt>` (`prefix` = version + OS + toolchain/manifest
#    hash; `kind` = `core` here, `align` for the alignment workflow, `core-pr<N>` on a PR's own
#    ref). Which entry a job restores is decided BY LINEAGE, not by recency: `scripts/ci/cache_pick.py`
#    walks the first-parent history of the commit (a PR's `HEAD^1` is the `main` tip its merge
#    tree contains) and returns the exact key of the nearest ancestor's build, own-PR entries
#    first; the two `restore-keys` are the same for the case where the listing fails. A bare
#    `<prefix>-` fallback is never used — it matched whatever was written last, and rebuilt a
#    scripts-only PR from a stale tree once (582 modules, 22 minutes).
# 3. The build is resumable. `lake build` runs under a 5-hour `timeout` and the cache is saved on
#    success or failure — never on a CANCELLED job: a cancelled `lake build` can leave a truncated
#    `.olean` behind its already-written trace and poison every later restore (seen 2026-09-20).
#    Pushes to a PR supersede each other; runs on `main` QUEUE instead (a cancelled `main` build
#    saved nothing and the next run started from the entry before it). A poisoned entry is purged
#    with the `Cache cleanup` workflow's `delete_key` input, or by bumping `SP1_CACHE_VERSION`.
#
# Structure: `guards` (source-policy gates, seconds) runs in parallel with `build`, which builds the
# core, its test set, saves the cache, then lints and runs the export identity — one job, one
# toolchain/mathlib setup, instead of three jobs each paying that overhead for seconds of work. The
# job ends by dropping the PR's older entries (`scripts/ci/cache_gc.py --only-ref`); the daily
# `Cache cleanup` workflow keeps the whole cache under budget.
#
# Hand-off: a PR's cache entry lives on `refs/pull/N/merge`, which `main` cannot restore, so every
# merge used to redo the PR's whole build on `main` (24 minutes after a module-mode change, 75 after
# an options change). The `handoff` job (PR only, after `build`, not a required check) uploads the
# PR's build as an artifact named by its head sha; the `main` run finds it through the merge
# commit's second parent, unpacks it, deletes it, and its `lake build` is then seconds. A squash
# merge, an expired artifact or a failed PR run simply fall through to the lineage restore.
#
# Scope: `build` = `lake build` of `SP1Core` + `ToClean` + `ToMathlib` + `ToPolyFun` (the
# generic/semantic layers and the chip circuits with their proofs, through the gated root index
# `SP1Clean/Core.lean`) and `lake test` = `SP1CoreTest`; it is the required check on every PR.
# `build-full` = the SP1-alignment layers (`lake build SP1Clean`: extracted oracles, Faithful, the
# per-chip Sail bridges and machine contracts, Proofs/Sail, Proofs/Completeness, Soundness,
# Composition), the full test library, `lake lint` over everything, the witgen/dump conformance
# gates, and both trust-policy scopes. It runs after `build` on every push to `main`, weekly, on a
# dispatch with `alignment` set, and on a PR carrying the `ci:alignment` label — restoring the
# exact core entry `build` just saved, so it only ever builds the alignment closure of the change
# (the old separate workflow raced the core save and restored stale entries). It is not gated on
# paths: a PR touching the alignment strata gets a notice from `guards` and opts in with the
# label, so that PR CI stays a core build by default. Every build runs with `--wfail --iofail`: a
# warning (the Mathlib standard linter set is on package-wide) or a stray `info:` note fails the
# job. Measurement and tooling: docs/agents/build-profiling.md.

on:
  push:
    branches: ["main", "ci-testing"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      alignment:
        description: "also run build-full (the alignment layers, tests, lint, trust policy)"
        type: boolean
        default: false

env:
  # Bump to invalidate every cache entry (toolchain and manifest changes already rekey; a change to
  # CACHE_PATHS requires it).
  SP1_CACHE_VERSION: v2
  CACHE_PATHS: |
    .lake/build
    .lake/packages/*
    !.lake/packages/mathlib
    !.lake/packages/batteries
    !.lake/packages/aesop
    !.lake/packages/Qq
    !.lake/packages/proofwidgets
    !.lake/packages/importGraph
    !.lake/packages/LeanSearchClient
    !.lake/packages/plausible

jobs:
  guards:
    # Lightweight source-policy gates — run on a standard runner in parallel with the
    # heavy build so a forbidden pattern blocks the PR in seconds without a Lean build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: No skipKernelTC in source
        run: scripts/check_no_skipkerneltc.sh
      - name: No native_decide in the main SP1Clean library
        run: scripts/check_no_native_decide.sh
      - name: Elaboration-budget escape hatches confined to the measured allowlist
        run: scripts/check_option_escapes.sh
      - name: Witness-generation escape hatches (enforced — the witgen cutover is complete)
        run: scripts/check_no_witness_native.sh --enforce
      - name: Committed witgen export is structurally clean
        run: scripts/check_witgen_export.sh
      - name: Recorded pins match the build graph
        run: scripts/check_pins.sh
      - name: Trust policy is well-formed
        run: python3 scripts/check_trust.py --validate-policy-only
      - name: Audit tooling regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Root index imports every module
        run: scripts/check_root_index.sh
      - name: SP1 field has one Lean owner
        run: scripts/check_sp1_field_singleton.sh
      - name: Shared shard vocabulary has one owner
        run: scripts/check_shared_vocabulary.sh
      - name: Doc citations resolve
        run: scripts/check_report_citations.sh
      - name: Audit-surface index matches the tree
        run: scripts/check_audit_surface.sh
      - name: Layering contract holds
        run: scripts/check_layering.sh
      - name: Alignment strata touched without the ci:alignment label?
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:alignment')
        run: |
          git fetch -q --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          touched=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
            | grep -E '^(SP1Clean/(Faithful|Soundness|Composition|Alignment|Extracted|Proofs/Sail|Proofs/Completeness)/|SP1Clean/Proofs/Chips/[^/]+/(Bridge|Contracts)\.lean|SP1CleanTest/Alignment/|update_extracted\.py|export/)' || true)
          if [ -n "$touched" ]; then
            echo "::notice title=alignment layers touched::This PR changes alignment-layer files but has no ci:alignment label, so build-full will not run before merge:"
            echo "$touched"
          fi

  build:
    runs-on: ubuntu-latest
    # Below GitHub's 6-hour job limit, above the 5-hour `timeout` on `lake build` so the cache
    # save step always gets to run.
    timeout-minutes: 350
    # PR pushes supersede each other; `main` queues (one running + one pending per group).
    concurrency:
      group: core-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      # Three concurrent `lean` processes (each `-j2` from the lakefile): the 2026-09-21 matrix on
      # this runner (fork issue #39) — 4 × 4 threads 32.4 min cold, 3 × 2 threads 26.9 min.
      LEAN_NUM_THREADS: "3"
    outputs:
      cache-prefix: ${{ steps.key.outputs.prefix }}
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the lineage walk needs history
          fetch-depth: 0
      - name: Free disk space if the image is short of it
        # The image has ~110 GB free; the toolchain, mathlib oleans, the project build and the
        # cache archives need about 16 GB. The removal (30–230 s) only runs if that ever changes.
        run: |
          avail=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          if [ "$avail" -lt 25 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
              /usr/local/share/boost /usr/local/.ghcup
          fi
          df -h /
      - name: Compute cache keys and pick the entry to restore
        id: key
        run: |
          prefix="sp1-${SP1_CACHE_VERSION}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr="${{ github.event.pull_request.number }}"
            echo "key=${prefix}-core-pr${pr}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
            git rev-list --first-parent -n 30 HEAD^1 > lineage.txt
            python3 scripts/ci/cache_pick.py --mode pr --pr "$pr" --prefix "$prefix" --lineage lineage.txt >> "$GITHUB_OUTPUT"
          else
            echo "key=${prefix}-core-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
            git rev-list --first-parent -n 30 HEAD > lineage.txt
            python3 scripts/ci/cache_pick.py --mode main --prefix "$prefix" --lineage lineage.txt >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - name: Hand-off from the merged PR (pushes to main)
        id: handoff
        if: github.event_name == 'push'
        run: |
          h2=$(git rev-parse --verify -q HEAD^2 || true)
          if [ -z "$h2" ]; then echo "not a merge commit; lineage restore"; exit 0; fi
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=lake-build-${h2}&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -z "$id" ]; then echo "no hand-off artifact for ${h2}; lineage restore"; exit 0; fi
          gh api "repos/${{ github.repository }}/actions/artifacts/${id}/zip" > handoff.zip
          unzip -q handoff.zip && tar --zstd -xf lake-build.tar.zst && rm -f handoff.zip lake-build.tar.zst
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${id}" || true
          echo "restored=true" >> "$GITHUB_OUTPUT"
          du -sh .lake/build
      - name: Restore the project build cache (by lineage)
        if: steps.handoff.outputs.restored != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ steps.key.outputs.pick || format('{0}-none', steps.key.outputs.prefix) }}
          restore-keys: |
            ${{ steps.key.outputs.fallback1 }}
            ${{ steps.key.outputs.fallback2 }}
      - uses: leanprover/lean-action@v1
        # Installs the pinned toolchain and fetches the mathlib olean cache; the build itself runs
        # in the next step so it can be bounded by `timeout`.
        with:
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Build (resumable — a cold cache may need one re-run)
        run: timeout 5h lake build --wfail --iofail
      - name: Core tests (lake test = SP1CoreTest, with the warning/info gates)
        # Test modules are the ONLY place `native_decide` is allowed, gated separately from the
        # `native_decide`-free main build; their oleans ride in the same cache entry.
        run: timeout 5h lake build --wfail --iofail SP1CoreTest
      - name: Save the project build cache
        # Before lint and the export check, so a lint failure never loses the build.
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ steps.key.outputs.key }}
      - name: Environment linters, core scope (runLinter on the core index)
        # Batteries' `runLinter`, the package's `lintDriver` (AGENTS.md § Linters). `lake lint`
        # needs the umbrella oleans, which only the alignment workflow builds; here the driver runs
        # on the core index.
        run: lake exe runLinter --no-build SP1Clean.Core ToClean ToMathlib ToPolyFun
      - name: Whole-ensemble export identity
        run: bash scripts/check_ensemble_export.sh
      - name: Drop this PR's older cache entries
        if: github.event_name == 'pull_request' && (success() || failure())
        run: |
          python3 scripts/ci/cache_gc.py --repo "${{ github.repository }}" --prefix "${{ steps.key.outputs.prefix }}" \
            --only-ref "refs/pull/${{ github.event.pull_request.number }}/merge" --apply

  handoff:
    # PR only; off the required check. Re-restores this run's entry (restore-only, no toolchain) and
    # publishes it as an artifact the `main` run after the merge picks up.
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ needs.build.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Pack
        run: |
          dirs=".lake/build"
          for d in .lake/packages/*/; do
            case "$d" in
              */mathlib/|*/batteries/|*/aesop/|*/Qq/|*/proofwidgets/|*/importGraph/|*/LeanSearchClient/|*/plausible/) ;;
              *) dirs="$dirs ${d%/}" ;;
            esac
          done
          # shellcheck disable=SC2086
          tar --zstd -cf lake-build.tar.zst $dirs
          ls -l lake-build.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: lake-build-${{ github.event.pull_request.head.sha }}
          path: lake-build.tar.zst
          retention-days: 3
          compression-level: 0

  build-full:
    # The alignment layers on top of the core entry `build` just saved (same run, exact key: no
    # race, no stale lineage). One job for the full build, the full test library, `lake lint`, the
    # export/witgen gates and both trust-policy scopes — the old four-job workflow paid the toolchain/mathlib
    # setup four times. `main` queues; a PR run supersedes its previous one.
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.alignment) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:alignment'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: align-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      LEAN_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          # Cache selection uses the first-parent lineage below.
          fetch-depth: 0
      - name: Free disk space if the image is short of it
        run: |
          avail=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          if [ "$avail" -lt 25 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
              /usr/local/share/boost /usr/local/.ghcup
          fi
          df -h /
      - name: Compute cache keys and pick the entry to restore
        id: key
        run: |
          prefix="${{ needs.build.outputs.cache-prefix }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "key=${prefix}-align-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
            git rev-list --first-parent -n 30 HEAD^1 > lineage.txt
          else
            echo "key=${prefix}-align-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
            git rev-list --first-parent -n 30 HEAD > lineage.txt
          fi
          python3 scripts/ci/cache_pick.py --mode align --prefix "$prefix" --lineage lineage.txt \
            --core-key "${{ needs.build.outputs.cache-key }}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Restore the core entry this run saved (else by lineage)
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ steps.key.outputs.pick || format('{0}-none', needs.build.outputs.cache-prefix) }}
          restore-keys: |
            ${{ steps.key.outputs.fallback1 }}
            ${{ steps.key.outputs.fallback2 }}
      - uses: leanprover/lean-action@v1
        with:
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Full build (resumable — a cold cache may need one re-run)
        run: timeout 5h lake build --wfail --iofail SP1Clean ToClean ToMathlib ToPolyFun
      - name: Full test library (lake build SP1CleanTest)
        run: timeout 5h lake build --wfail --iofail SP1CleanTest
      - name: Save the alignment build cache
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ steps.key.outputs.key }}
      - name: Environment linters (lake lint = batteries/runLinter over the four roots)
        run: lake lint -- --no-build
      - name: Whole-ensemble export identity
        run: bash scripts/check_ensemble_export.sh
      # The committed export/witgen goldens must match a fresh regeneration byte-for-byte; the
      # exporter maps native rows through the `Faithful` reconfigure maps, so it needs the full
      # library built above even though the exportability battery itself is core.
      - name: Witgen export matches a fresh regeneration
        run: scripts/check_witgen_export.sh --regen
      - name: Compiled trust-checker regression fixtures
        run: lake env python3 scripts/test_trust_integration.py
      - name: Release audit and compiled-library trust policy
        run: scripts/run_audit.sh
      - name: Upload trust diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/build/trust/
          if-no-files-found: ignore
          retention-days: 14
      - name: Garbage-collect the cache by rule
        if: github.event_name != 'pull_request' && (success() || failure())
        run: python3 scripts/ci/cache_gc.py --repo "${{ github.repository }}" --prefix "${{ needs.build.outputs.cache-prefix }}" --apply
      - name: Drop this PR's older alignment entries
        if: github.event_name == 'pull_request' && (success() || failure())
        run: |
          python3 scripts/ci/cache_gc.py --repo "${{ github.repository }}" --prefix "${{ needs.build.outputs.cache-prefix }}" \
            --only-ref "refs/pull/${{ github.event.pull_request.number }}/merge" --apply
