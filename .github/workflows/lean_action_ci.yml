name: Lean Action CI

# GitHub-hosted runners only (`ubuntu-latest`: 4 vCPU / 16 GB; a personal account cannot use larger
# runners). Three measures make that feasible:
#
# 1. Mathlib is never stored in the GitHub Actions cache. lean-action's `use-mathlib-cache` runs
#    `lake exe cache get` (about 6 GB of oleans, one to two minutes), which keeps every cache entry
#    well below the 10 GB per-repository limit; the same tool also restores Batteries, Aesop, Qq,
#    ProofWidgets, importGraph, LeanSearchClient and plausible (measured 2026-09-21; `Cli` is not
#    among them), so those seven are excluded from our entries too (`CACHE_PATHS`). NB the path list is part of the entry's version hash: editing it
#    invalidates every existing entry, so bump `SP1_CACHE_VERSION` in the same change.
# 2. The project build (`.lake/build`) and the remaining package checkouts are cached under a key
#    `<prefix>-<kind>-<sha>-<run id>-<attempt>` (`prefix` = version + OS + toolchain/manifest
#    hash; `kind` = `core` for core-only runs, `align` for full runs, with `-pr<N>` on a PR's
#    own ref). Which entry a job restores is decided BY LINEAGE, not by recency: `scripts/ci/cache_pick.py`
#    walks the first-parent history of the commit (a PR's `HEAD^1` is the `main` tip its merge
#    tree contains) and returns the exact key of the nearest ancestor's build, own-PR entries
#    first; the two `restore-keys` are the same for the case where the listing fails. A bare
#    `<prefix>-` fallback is never used — it matched whatever was written last, and rebuilt a
#    scripts-only PR from a stale tree once (582 modules, 22 minutes).
# 3. The build is resumable. `lake build` runs under a 5-hour `timeout` and the cache is saved on
#    success or failure — never on a CANCELLED job: a cancelled `lake build` can leave a truncated
#    `.olean` behind its already-written trace and poison every later restore (seen 2026-09-20).
#    Pushes to a PR supersede each other; runs on `main` QUEUE instead (a cancelled `main` build
#    saved nothing and the next run started from the entry before it). A poisoned entry is purged
#    with the `Cache cleanup` workflow's `delete_key` input, or by bumping `SP1_CACHE_VERSION`.
#
# One runner builds Lean and runs lint/backend/trust gates once. Two export jobs use its
# compiled driver; a comparison job verifies their source/pin identity and every artifact hash.
# Rust fixture families then compile on separate runners. `build-full` requires every stage.
# Full checks run on every PR, main push, weekly schedule and alignment/clean dispatch.
# A core-only dispatch or ci-testing push still builds/tests/lints just the core.
#
# PR caches are invisible to main. After all full checks pass, the runner uploads the completed
# build as an artifact named by the PR head; main finds it through the merge's second parent.
# Lake still checks the merged tree's content hashes. Squash merges/missing artifacts fall back
# to lineage. The archive includes alignment and full tests, the most expensive outputs.
#
# A second, pin-keyed cache retains native dependency objects missing from Mathlib's download.
# Only a successful full build saves it, after building backendGadgets and ensembleExport. Weekly/manual clean
# builds discard project outputs once; core and full then share the fresh build directory.
# Every build uses --wfail --iofail. Measurement: docs/agents/build-profiling.md.

on:
  push:
    branches: ["main", "ci-testing"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Discard project build outputs and run all checks (reuse dependencies)"
        type: boolean
        default: false
      alignment:
        description: "also run full alignment, tests, lint and trust checks"
        type: boolean
        default: false

# Cancel the entire obsolete PR validation graph, including downstream matrix jobs.
# Main keeps its resumable build: one running validation and one pending per ref.
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bump to invalidate every cache entry (toolchain and manifest changes already rekey; a change to
  # CACHE_PATHS requires it). Keep cache-cleanup/build-experiment in sync (gated by tests).
  SP1_CACHE_VERSION: v2
  CACHE_PATHS: |
    .lake/build
    .lake/packages/*
    !.lake/packages/mathlib
    !.lake/packages/batteries
    !.lake/packages/aesop
    !.lake/packages/Qq
    !.lake/packages/proofwidgets
    !.lake/packages/importGraph
    !.lake/packages/LeanSearchClient
    !.lake/packages/plausible
  # Mathlib's cache supplies generated C, but not these objects and their Lake traces/hashes.
  # Keep this list separate from CACHE_PATHS: its exclusions apply to all matching paths.
  NATIVE_CACHE_PATHS: |
    .lake/packages/mathlib/.lake/build/ir/**/*.c.o*
    .lake/packages/batteries/.lake/build/ir/**/*.c.o*
    .lake/packages/aesop/.lake/build/ir/**/*.c.o*
    .lake/packages/Qq/.lake/build/ir/**/*.c.o*
    .lake/packages/proofwidgets/.lake/build/ir/**/*.c.o*
    .lake/packages/importGraph/.lake/build/ir/**/*.c.o*
    .lake/packages/LeanSearchClient/.lake/build/ir/**/*.c.o*
    .lake/packages/plausible/.lake/build/ir/**/*.c.o*

jobs:
  guards:
    # Lightweight source-policy gates — run on a standard runner in parallel with the
    # heavy build so a forbidden pattern blocks the PR in seconds without a Lean build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: No skipKernelTC in source
        run: scripts/check_no_skipkerneltc.sh
      - name: No native_decide in the main SP1Clean library
        run: scripts/check_no_native_decide.sh
      - name: Elaboration-budget escape hatches confined to the measured allowlist
        run: scripts/check_option_escapes.sh
      - name: Witness-generation escape hatches (enforced — the witgen cutover is complete)
        run: scripts/check_no_witness_native.sh --enforce
      - name: Recorded pins match the build graph
        run: scripts/check_pins.py --source-only
      - name: Trust policy is well-formed
        run: python3 scripts/check_trust.py --validate-policy-only
      - name: Audit tooling regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Root index imports every module
        run: scripts/check_root_index.sh
      - name: SP1 field has one Lean owner
        run: scripts/check_sp1_field_singleton.sh
      - name: Shared shard vocabulary has one owner
        run: scripts/check_shared_vocabulary.sh
      - name: Documentation links and module docstrings
        run: python3 scripts/check_current_docs.py
      - name: Layering contract holds
        run: scripts/check_layering.sh

  build:
    runs-on: ubuntu-latest
    # Below GitHub's 6-hour job limit; individual builds have a 5-hour timeout. Cache saving
    # runs after ordinary build failures, but a cancelled/timed-out job is never saved.
    timeout-minutes: 350
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CLEAN_BUILD: ${{ github.event_name == 'schedule' || inputs.clean_build == true }}
      FULL_BUILD: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.alignment || inputs.clean_build)) || github.event_name == 'pull_request' }}
      # Three concurrent `lean` processes (each `-j2` from the lakefile): the 2026-09-21 matrix on
      # this runner (fork issue #39) — 4 × 4 threads 32.4 min cold, 3 × 2 threads 26.9 min.
      LEAN_NUM_THREADS: "3"
    outputs:
      full-build: ${{ env.FULL_BUILD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the lineage walk needs history
          fetch-depth: 0
      - name: Runner inventory
        run: lscpu
      - name: Free disk space if the image is short of it
        # The image has ~110 GB free; the toolchain, mathlib oleans, the project build and the
        # cache archives need about 16 GB. The removal (30–230 s) only runs if that ever changes.
        run: |
          avail=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          if [ "$avail" -lt 25 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
              /usr/local/share/boost /usr/local/.ghcup
          fi
          df -h /
      - name: Compute cache keys and pick the entry to restore
        id: key
        run: |
          mkdir -p .lake/ci
          prefix="sp1-${SP1_CACHE_VERSION}-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}"
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          kind=core
          if [ "$FULL_BUILD" = "true" ]; then kind=align; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr="${{ github.event.pull_request.number }}"
            echo "key=${prefix}-${kind}-pr${pr}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
            git rev-list --first-parent -n 30 HEAD^1 > .lake/ci/lineage.txt
            python3 scripts/ci/cache_pick.py --mode pr --pr "$pr" --prefix "$prefix" --lineage .lake/ci/lineage.txt >> "$GITHUB_OUTPUT"
          else
            echo "key=${prefix}-${kind}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
            git rev-list --first-parent -n 30 HEAD > .lake/ci/lineage.txt
            python3 scripts/ci/cache_pick.py --mode main --prefix "$prefix" --lineage .lake/ci/lineage.txt >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - name: Hand-off from the merged PR (pushes to main)
        id: handoff
        if: github.event_name == 'push' && env.CLEAN_BUILD != 'true'
        run: |
          h2=$(git rev-parse --verify -q HEAD^2 || true)
          if [ -z "$h2" ]; then echo "not a merge commit; lineage restore"; exit 0; fi
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=lake-full-build-${h2}&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -z "$id" ]; then echo "no hand-off artifact for ${h2}; lineage restore"; exit 0; fi
          gh api "repos/${{ github.repository }}/actions/artifacts/${id}/zip" > handoff.zip
          unzip -q handoff.zip && tar --zstd -xf lake-build.tar.zst && rm -f handoff.zip lake-build.tar.zst
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${id}" || true
          echo "restored=true" >> "$GITHUB_OUTPUT"
          du -sh .lake/build
      - name: Restore the project build cache (by lineage)
        if: steps.handoff.outputs.restored != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ steps.key.outputs.pick || format('{0}-none', steps.key.outputs.prefix) }}
          restore-keys: |
            ${{ steps.key.outputs.fallback1 }}
            ${{ steps.key.outputs.fallback2 }}
      - name: Discard project outputs for a clean build
        if: env.CLEAN_BUILD == 'true'
        run: rm -rf .lake/build
      - uses: leanprover/lean-action@v1
        # Installs the pinned toolchain and fetches the mathlib olean cache; the build itself runs
        # in the next step so it can be bounded by `timeout`.
        with:
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Restore native dependency objects
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NATIVE_CACHE_PATHS }}
          # v2 also retains the native objects required by ensembleExport. The
          # same-pin v1 fallback reuses existing objects before filling its gaps.
          key: sp1-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            sp1-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - uses: ./.github/actions/prepare-sail
      - name: Build (resumable — a cold cache may need one re-run)
        run: timeout 5h lake build --wfail --iofail
      - name: Core tests (lake test = SP1CoreTest, with the warning/info gates)
        # Test modules are the ONLY place `native_decide` is allowed, gated separately from the
        # `native_decide`-free main build; their oleans ride in the same cache entry.
        run: timeout 5h lake build --wfail --iofail SP1CoreTest
      - name: Full build (resumable — a cold cache may need one re-run)
        if: env.FULL_BUILD == 'true'
        run: timeout 5h lake --no-cache build --wfail --iofail SP1Clean ToClean ToMathlib ToPolyFun backendGadgets
      - name: Full test library (lake build SP1CleanTest)
        if: env.FULL_BUILD == 'true'
        run: timeout 5h lake build --wfail --iofail SP1CleanTest
      - name: Build and authenticate the ensemble exporter
        run: python3 scripts/check_ensemble_export.py prepare --output .lake/ensemble-export/driver
      - name: Upload compiled exporter
        uses: actions/upload-artifact@v4
        with:
          name: ensemble-driver-${{ github.run_id }}
          overwrite: true
          path: .lake/ensemble-export/driver/
          if-no-files-found: error
          retention-days: 3
      - name: Save native dependency objects
        if: success() && env.FULL_BUILD == 'true' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NATIVE_CACHE_PATHS }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Save the project build cache
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ steps.key.outputs.key }}
      - name: Environment linters (full scope)
        if: env.FULL_BUILD == 'true'
        run: lake lint -- --no-build
      - name: Environment linters (core-only runs)
        if: env.FULL_BUILD != 'true'
        run: lake exe runLinter --no-build SP1Clean.Core ToClean ToMathlib ToPolyFun
      - name: Library examples and adversarial witnesses
        if: env.FULL_BUILD == 'true'
        id: examples
        env:
          SP1_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_examples.py
      - name: Upload example evidence
        if: always() && env.FULL_BUILD == 'true' && steps.examples.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: examples-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/build/examples/
          if-no-files-found: error
          retention-days: 30
      - name: Pinned Node for backend conformance
        if: env.FULL_BUILD == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: tools/backend-gadgets/package-lock.json
      - name: Install pinned backend checker
        if: env.FULL_BUILD == 'true'
        run: npm ci --prefix tools/backend-gadgets
      - name: Clean WASM and R1CS gadget conformance
        if: env.FULL_BUILD == 'true'
        run: scripts/check_backend_gadgets.sh
      - name: Compiled trust-checker regression fixtures
        if: env.FULL_BUILD == 'true'
        run: lake env python3 scripts/test_trust_integration.py
      - name: Release audit and compiled-library trust policy
        if: env.FULL_BUILD == 'true'
        run: scripts/run_audit.sh
      - name: Upload trust diagnostics
        if: always() && env.FULL_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trust-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/build/trust/
          if-no-files-found: ignore
          retention-days: 14
      - name: Pack the completed PR build for main
        if: github.event_name == 'pull_request'
        run: |
          dirs=".lake/build"
          for d in .lake/packages/*/; do
            case "$d" in
              */mathlib/|*/batteries/|*/aesop/|*/Qq/|*/proofwidgets/|*/importGraph/|*/LeanSearchClient/|*/plausible/) ;;
              *) dirs="$dirs ${d%/}" ;;
            esac
          done
          # shellcheck disable=SC2086
          tar --zstd -cf lake-build.tar.zst $dirs
      - name: Hand off the completed PR build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lake-full-build-${{ github.event.pull_request.head.sha }}
          path: lake-build.tar.zst
          overwrite: true
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Garbage-collect the cache by rule
        if: github.event_name != 'pull_request' && (success() || failure())
        run: python3 scripts/ci/cache_gc.py --repo "${{ github.repository }}" --prefix "${{ steps.key.outputs.prefix }}" --apply
      - name: Drop this PR's older cache entries
        if: github.event_name == 'pull_request' && (success() || failure())
        run: |
          python3 scripts/ci/cache_gc.py --repo "${{ github.repository }}" --prefix "${{ steps.key.outputs.prefix }}" \
            --only-ref "refs/pull/${{ github.event.pull_request.number }}/merge" --apply

  # Hand-off names are stable across attempts: rerunning only failed jobs must be able
  # to consume successful producers from an earlier attempt of this same source revision.
  export-generate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        generation: [first, second]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ensemble-driver-${{ github.run_id }}
          path: .lake/ensemble-export/driver/
      - name: Generate fresh AIR, witnesses and references
        env:
          LEAN_NUM_THREADS: "3"
        run: >-
          python3 scripts/check_ensemble_export.py generate
          --driver .lake/ensemble-export/driver
          --output .lake/ensemble-export/${{ matrix.generation }}
      - name: Preserve generation and resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ensemble-${{ matrix.generation }}-${{ github.run_id }}
          overwrite: true
          path: .lake/ensemble-export/${{ matrix.generation }}/
          if-no-files-found: error
          retention-days: 3

  export-verify:
    needs: export-generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ensemble-first-${{ github.run_id }}
          path: .lake/ensemble-export/first/
      - uses: actions/download-artifact@v4
        with:
          name: ensemble-second-${{ github.run_id }}
          path: .lake/ensemble-export/second/
      - name: Verify provenance and deterministic inventory
        run: >-
          python3 scripts/check_ensemble_export.py verify
          --first .lake/ensemble-export/first --second .lake/ensemble-export/second
          --output .lake/ensemble-export/verified
      - name: Publish verified Cargo inputs before compilation
        uses: actions/upload-artifact@v4
        with:
          name: ensemble-verified-${{ github.run_id }}
          overwrite: true
          path: .lake/ensemble-export/verified/
          if-no-files-found: error
          retention-days: 14

  export-rust:
    needs: export-verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        configuration: [default, mprotect]
        group:
          - components
          - assembly_boundaries_export
          - assembly_stopped_export
          - assembly_hint_read_export
          - assembly_halt_export
          - assembly_commitments_export
          - assembly_ordinary_export
          - assembly_hints_export
          - assembly_enter_export
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ensemble-verified-${{ github.run_id }}
          path: .lake/ensemble-export/verified/
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/sp1-comparison
          # Dependencies share a cache; only the component job writes each feature key.
          key: clean-export-${{ matrix.configuration }}
          save-if: ${{ matrix.group == 'components' }}
      - name: Compile and compare one fixture family
        run: >-
          python3 scripts/check_ensemble_export.py rust
          --inputs .lake/ensemble-export/verified --output .lake/ensemble-export/results
          --group ${{ matrix.group }} --configuration ${{ matrix.configuration }}
      - name: Preserve comparison and resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ensemble-rust-${{ matrix.group }}-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/ensemble-export/results/
          if-no-files-found: error
          retention-days: 14

  build-full:
    # Missing, failed, cancelled and skipped prerequisite jobs must all fail this gate.
    needs: [guards, build, export-generate, export-verify, export-rust]
    if: >-
      always() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && (inputs.alignment || inputs.clean_build)) ||
        github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - name: Full validation passed
        env:
          REQUIRED_JOBS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check_full_validation.py
